name: Starter integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  starter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.lock
      - run: python -m scripts.prepare_data
      - run: python -m scripts.export_contract
      - run: npm ci --prefix frontend
      - run: npm run generate:types --prefix frontend
      - run: git diff --exit-code -- data/processed shared/openapi.json frontend/src/api.generated.ts
      - run: python -m pytest -q
      - run: npm run build --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/urbaneye-api.log 2>&1 &
          python -c "import time, urllib.request; exec('for _ in range(30):\n try:\n  urllib.request.urlopen(\"http://127.0.0.1:8000/health\"); break\n except OSError: time.sleep(1)\nelse: raise RuntimeError(\"API did not start\")')"
          npm run test:e2e --prefix frontend
